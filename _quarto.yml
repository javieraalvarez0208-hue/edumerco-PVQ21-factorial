# Configuracion principal de la plantilla FACSO (Modo Documento Único)

project:
  type: default        
  output-dir: docs
  resources:
    - assets/favicon-2025-20251031.svg

title: "Análisis factorial PVQ21 en EDUMERCO"
subtitle: "Informe"
author:
  - name: "Javiera Álvarez Cárdenas"
    affiliation: "Departamento de Sociología, Universidad de Chile"
    orcid: "0000-0000-0000-0000"
date: today
date-format: "D [de] MMMM [de] YYYY"

csl: refs/apa.csl                  
bibliography: refs/referencias.bib
link-citations: true             
reference-location: section      

format:
  html:
    theme:
      light: cosmo               
    toc: true                    
    toc-depth: 3
    toc-location: right
    number-sections: true
    code-copy: true              
    code-tools: true             
    df-print: paged              
    css: assets/styles.scss      
    favicon: assets/favicon-2025-20251031.svg 
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - includes/justify.html     
    include-after-body:
      - includes/logo-link.html   
      - includes/citefix.html     
      - includes/renumber.html    
      - includes/code-toggle.html 
      - includes/toc-enhance.html 

  pdf:
    pdf-engine: xelatex          
    toc: false                   
    lof: false
    lot: false
    keep-tex: true
    documentclass: scrbook       
    classoption:
      - oneside
    papersize: a4                
    geometry:
      - top=25mm
      - bottom=25mm
      - left=30mm
      - right=20mm
    colorlinks: true
    number-sections: true
    include-in-header: includes/preamble.tex     
    include-before-body: includes/title-pdf.tex  
    include-after-body: includes/backmatter.tex  
    fig-cap-location: top
    tbl-cap-location: top

execute:
  echo: true                     
  warning: false
  message: false
  freeze: auto                   
  fig-path: "docs/figures/"

lang: es

crossref:
  appendix-title: Anexo
  appendix-delim: " - "

metadata-files:
  - _metadata.yml               